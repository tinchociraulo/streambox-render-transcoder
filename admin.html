<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StreamBox Admin</title>
<style>
  :root{--bg:#0a0a0f;--surface:#12121a;--surface2:#1a1a26;--border:#2a2a3d;--accent:#e63946;--text:#edf2f4;--muted:#8b93a5;--ok:#4ade80}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
  header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--border);background:#0d0d14}
  h1{font-size:22px;margin:0} h1 span{color:var(--accent)}
  main{padding:28px;max-width:1280px;margin:auto}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:18px}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .grid{display:grid;grid-template-columns:repeat(3,minmax(180px,1fr));gap:12px}
  label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);margin-bottom:6px}
  input,select{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px;font-size:14px}
  button{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:700}
  button.primary{background:var(--accent);border-color:var(--accent);color:white}
  button.ok{background:#166534;border-color:#166534}
  button.warn{background:#7f1d1d;border-color:#7f1d1d}
  button:hover{filter:brightness(1.12)}
  table{width:100%;border-collapse:collapse;min-width:1100px}
  th,td{border-bottom:1px solid var(--border);padding:10px;text-align:left;vertical-align:top;font-size:13px}
  th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px}
  .table-wrap{overflow:auto}
  .pill{display:inline-block;padding:3px 8px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);font-size:12px}
  .hidden{display:none}
  .toast{position:fixed;right:22px;bottom:22px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 16px;color:var(--text)}
  .muted{color:var(--muted);font-size:13px}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  @media(max-width:800px){.grid{grid-template-columns:1fr}main{padding:14px}header{padding:0 14px}}
</style>
</head>
<body>
<header>
  <h1>Stream<span>Box</span> Admin</h1>
  <div class="row">
    <span class="muted" id="who"></span>
    <button onclick="logout()">Salir</button>
  </div>
</header>
<main>
  <section class="card" id="loginCard">
    <h2>Ingresar</h2>
    <div class="grid">
      <div><label>Usuario</label><input id="loginUser" autocomplete="username" value="admin"></div>
      <div><label>Contraseña</label><input id="loginPass" type="password" autocomplete="current-password" placeholder="streambox123"></div>
      <div style="align-self:end"><button class="primary" onclick="login()">Entrar</button></div>
    </div>
    <p class="muted">Primer ingreso por defecto: admin / streambox123. Cambialo apenas entres.</p>
  </section>

  <section class="card hidden" id="createCard">
    <h2>Crear / editar usuario</h2>
    <input id="editId" type="hidden">
    <div class="grid">
      <div><label>Usuario</label><input id="username" placeholder="martin"></div>
      <div><label>Contraseña nueva</label><input id="password" type="password" placeholder="mínimo 6 caracteres"></div>
      <div><label>Rol</label><select id="role"><option value="user">Usuario</option><option value="admin">Administrador</option></select></div>
      <div><label>Activo</label><select id="active"><option value="true">Sí</option><option value="false">No</option></select></div>
      <div><label>Cloudflare Worker URL</label><input id="workerUrl" placeholder="https://torbox-workerjs.mfciraulo.workers.dev"></div>
      <div><label>Render Transcoder URL</label><input id="transcoderUrl" placeholder="https://streambox-render-transcoder.onrender.com"></div>
      <div style="grid-column:1/-1"><label>TorBox API Key</label><input id="torboxApiKey" type="password" placeholder="tb-..."></div>
    </div>
    <div class="row" style="margin-top:14px">
      <button class="primary" onclick="saveUser()">Guardar usuario</button>
      <button onclick="resetForm()">Nuevo limpio</button>
    </div>
  </section>

  <section class="card hidden" id="usersCard">
    <div class="row" style="justify-content:space-between">
      <h2>Usuarios</h2>
      <button onclick="loadUsers()">Actualizar</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Usuario</th><th>Rol</th><th>Activo</th><th>Worker</th><th>TorBox</th><th>Render</th><th>Acciones</th></tr></thead>
        <tbody id="usersBody"></tbody>
      </table>
    </div>
  </section>
</main>
<script>
const API = location.origin;
let token = localStorage.getItem('sb_admin_token') || '';
let users = [];

function toast(msg){document.querySelectorAll('.toast').forEach(t=>t.remove());const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),3500)}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function mask(s){s=String(s||'');return s ? `${s.slice(0,5)}...${s.slice(-4)}` : '<span class="muted">vacío</span>'}
async function api(path, opts={}){
  const res = await fetch(API+path,{...opts,headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`,...(opts.headers||{})}});
  const json = await res.json().catch(()=>({status:'error',error:'Respuesta inválida'}));
  if(!res.ok || json.status==='error') throw new Error(json.error||'Error');
  return json;
}

async function login(){
  const username=document.getElementById('loginUser').value.trim();
  const password=document.getElementById('loginPass').value;
  try{
    const json=await api('/auth/login',{method:'POST',headers:{Authorization:''},body:JSON.stringify({username,password})});
    if(json.user.role!=='admin') throw new Error('Este panel requiere administrador');
    token=json.token;localStorage.setItem('sb_admin_token',token);
    await bootstrap();
  }catch(e){toast(e.message)}
}

async function bootstrap(){
  try{
    const me=await api('/auth/me');
    if(me.user.role!=='admin') throw new Error('No sos administrador');
    document.getElementById('who').textContent=me.user.username;
    document.getElementById('loginCard').classList.add('hidden');
    document.getElementById('createCard').classList.remove('hidden');
    document.getElementById('usersCard').classList.remove('hidden');
    await loadUsers();
  }catch(e){
    localStorage.removeItem('sb_admin_token');
    token='';
    document.getElementById('loginCard').classList.remove('hidden');
  }
}

async function loadUsers(){
  const json=await api('/admin/users');
  users=json.users||[];
  document.getElementById('usersBody').innerHTML=users.map(u=>`
    <tr>
      <td><strong>${esc(u.username)}</strong><br><span class="muted">${esc(u.id)}</span></td>
      <td><span class="pill">${esc(u.role)}</span></td>
      <td>${u.active?'Sí':'No'}</td>
      <td>${esc(u.config?.workerUrl||'')}</td>
      <td>${mask(u.config?.torboxApiKey)}</td>
      <td>${esc(u.config?.transcoderUrl||'')}</td>
      <td><div class="actions">
        <button onclick="editUser('${u.id}')">Editar</button>
        <button class="warn" onclick="deleteUser('${u.id}')">Borrar</button>
      </div></td>
    </tr>`).join('');
}

function resetForm(){
  ['editId','username','password','workerUrl','torboxApiKey','transcoderUrl'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('role').value='user';
  document.getElementById('active').value='true';
}

function editUser(id){
  const u=users.find(x=>x.id===id);if(!u)return;
  document.getElementById('editId').value=u.id;
  document.getElementById('username').value=u.username;
  document.getElementById('password').value='';
  document.getElementById('role').value=u.role;
  document.getElementById('active').value=String(u.active);
  document.getElementById('workerUrl').value=u.config?.workerUrl||'';
  document.getElementById('torboxApiKey').value=u.config?.torboxApiKey||'';
  document.getElementById('transcoderUrl').value=u.config?.transcoderUrl||'';
  scrollTo({top:0,behavior:'smooth'});
}

async function saveUser(){
  const id=document.getElementById('editId').value;
  const payload={
    username:document.getElementById('username').value.trim(),
    password:document.getElementById('password').value,
    role:document.getElementById('role').value,
    active:document.getElementById('active').value==='true',
    config:{
      workerUrl:document.getElementById('workerUrl').value.trim(),
      torboxApiKey:document.getElementById('torboxApiKey').value.trim(),
      transcoderUrl:document.getElementById('transcoderUrl').value.trim(),
    }
  };
  if(id && !payload.password) delete payload.password;
  try{
    await api(id?`/admin/users/${id}`:'/admin/users',{method:id?'PUT':'POST',body:JSON.stringify(payload)});
    toast('Usuario guardado');
    resetForm();
    await loadUsers();
  }catch(e){toast(e.message)}
}

async function deleteUser(id){
  if(!confirm('¿Borrar usuario?'))return;
  try{await api(`/admin/users/${id}`,{method:'DELETE'});toast('Usuario borrado');await loadUsers()}catch(e){toast(e.message)}
}

async function logout(){
  try{await api('/auth/logout',{method:'POST'})}catch(e){}
  localStorage.removeItem('sb_admin_token');
  location.reload();
}

bootstrap();
</script>
</body>
</html>
